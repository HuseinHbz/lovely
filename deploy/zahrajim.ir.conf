# پیکربندی آماده‌ی Nginx برای zahrajim.ir روی پورت ۳۰۰۰.
# قالب عمومی و بدون دامنه در `nginx.conf.template` می‌ماند.

server {
    listen 80;
    listen [::]:80;
    server_name zahrajim.ir;

    # certbot این بلوک را با ریدایرکت به https جایگزین می‌کند.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zahrajim.ir;

    # ---------------------------------------------------------------
    # لاگ دسترسی خاموش است — عمدی.
    #
    # صفحه‌ی /about-this به کاربر قول داده «هیچ‌کس نمی‌بیند شما چه انتخاب
    # کردید». انتخاب‌ها در URL نیستند، ولی لاگ پیش‌فرض Nginx هر بازدید
    # /story/pNN را با زمان ثبت می‌کند و از رویش می‌شود فهمید کاربر تا کجا
    # رفته و کِی. آن قول را نصفه می‌کرد، پس لاگ خاموش شد.
    #
    # لاگ خطا در سطح crit می‌ماند تا مشکل واقعی سرور دیده شود؛ آن سطح
    # مسیرهای بازدیدشده را نمی‌نویسد.
    # ---------------------------------------------------------------
    access_log off;
    error_log /var/log/nginx/wolf-hedgehog.error.log crit;

    ssl_certificate     /etc/letsencrypt/live/zahrajim.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zahrajim.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # لایه‌ی چهارم جلوگیری از ایندکس.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # /api فقط از same-origin. درخواست با Origin بیگانه رد می‌شود.
    location /api/ {
        if ($http_origin !~ "^https://zahrajim.ir$") { return 403; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
